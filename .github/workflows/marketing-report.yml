name: Marketing report

# Monday 02:00 UTC: writes docs/marketing/reports/<last ISO week>.md (queue summary, Threads/Instagram insights,
# App Store campaign-link report). The weekly generator reads it before drafting the next queue.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to report (e.g. 2026-W44); empty = last week'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: marketing-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build report
        env:
          THREADS_TOKEN_FOURPOP_VI: ${{ secrets.THREADS_TOKEN_FOURPOP_VI }}
          THREADS_TOKEN_FOURPOP_TH: ${{ secrets.THREADS_TOKEN_FOURPOP_TH }}
          THREADS_TOKEN_NUNI_VI: ${{ secrets.THREADS_TOKEN_NUNI_VI }}
          THREADS_TOKEN_NUNI_TH: ${{ secrets.THREADS_TOKEN_NUNI_TH }}
          IG_TOKEN_FOURPOP_VI: ${{ secrets.IG_TOKEN_FOURPOP_VI }}
          IG_TOKEN_FOURPOP_TH: ${{ secrets.IG_TOKEN_FOURPOP_TH }}
          IG_TOKEN_NUNI_VI: ${{ secrets.IG_TOKEN_NUNI_VI }}
          IG_TOKEN_NUNI_TH: ${{ secrets.IG_TOKEN_NUNI_TH }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WEEK: ${{ inputs.week }}
        run: |
          # secrets cannot appear in step `if:` conditions, so the key file is written here only when present
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          fi
          if [ -n "$WEEK" ]; then pnpm marketing:report --week "$WEEK"; else pnpm marketing:report; fi
      - name: Commit report
        run: |
          if git diff --quiet -- docs/marketing/reports && [ -z "$(git ls-files --others --exclude-standard docs/marketing/reports)" ]; then echo "no changes"; exit 0; fi
          git config user.name "marketing-bot"
          git config user.email "marketing-bot@users.noreply.github.com"
          git add docs/marketing/reports
          git commit -m "docs(marketing): weekly report $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
