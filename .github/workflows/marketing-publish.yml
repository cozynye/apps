name: Marketing publish

# Publishes due social posts from marketing/queue (see marketing/README.md). Three slots a day in Indochina Time
# (07:30 · 12:30 · 20:00 = 00:30 · 05:30 · 13:00 UTC). GitHub cron can run minutes late; Buffer posts keep exact times.
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 5 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, no API calls, no commit'
        type: boolean
        default: true
      week:
        description: 'Only this ISO week (e.g. 2026-W44); empty = all'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish due posts
        env:
          THREADS_TOKEN_FOURPOP_VI: ${{ secrets.THREADS_TOKEN_FOURPOP_VI }}
          THREADS_TOKEN_FOURPOP_TH: ${{ secrets.THREADS_TOKEN_FOURPOP_TH }}
          THREADS_TOKEN_NUNI_VI: ${{ secrets.THREADS_TOKEN_NUNI_VI }}
          THREADS_TOKEN_NUNI_TH: ${{ secrets.THREADS_TOKEN_NUNI_TH }}
          IG_TOKEN_FOURPOP_VI: ${{ secrets.IG_TOKEN_FOURPOP_VI }}
          IG_TOKEN_FOURPOP_TH: ${{ secrets.IG_TOKEN_FOURPOP_TH }}
          IG_TOKEN_NUNI_VI: ${{ secrets.IG_TOKEN_NUNI_VI }}
          IG_TOKEN_NUNI_TH: ${{ secrets.IG_TOKEN_NUNI_TH }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_TIKTOK_FOURPOP_VI: ${{ secrets.BUFFER_CHANNEL_TIKTOK_FOURPOP_VI }}
          BUFFER_CHANNEL_TIKTOK_FOURPOP_TH: ${{ secrets.BUFFER_CHANNEL_TIKTOK_FOURPOP_TH }}
          BUFFER_CHANNEL_X_FOURPOP_TH: ${{ secrets.BUFFER_CHANNEL_X_FOURPOP_TH }}
          DRY_RUN: ${{ inputs.dry_run }}
          WEEK: ${{ inputs.week }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$WEEK" ]; then ARGS+=(--week "$WEEK"); fi
          pnpm marketing:publish "${ARGS[@]}"
      - name: Commit results
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- marketing/queue; then echo "no changes"; exit 0; fi
          git config user.name "marketing-bot"
          git config user.email "marketing-bot@users.noreply.github.com"
          git add marketing/queue
          git commit -m "chore(marketing): publish results $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
