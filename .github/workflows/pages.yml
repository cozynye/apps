name: Legal pages

# P21: publishes web/legal/public (support, privacy, terms) to GitHub Pages.
# Enable Pages (Settings › Pages › Source: GitHub Actions) and set the custom domain there.
on:
  push:
    branches: [main]
    paths: ['web/legal/**', 'design/legal/**', 'scripts/legal*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm legal:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/legal/public
      - id: deployment
        uses: actions/deploy-pages@v4
