# A2 Skip from the first page goes straight to A3.
appId: app.nuni.mood
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible:
      id: a2.skip
    timeout: 20000
- tapOn:
    id: a2.skip
- extendedWaitUntil:
    visible:
      id: a4.save
    timeout: 10000
- tapOn:
    id: a4.close
- extendedWaitUntil:
    visible:
      id: a3.title
    timeout: 10000
