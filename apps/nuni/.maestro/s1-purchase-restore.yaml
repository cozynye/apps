# S1: Test Store cancel / failed / valid purchase, then restore (RevenueCat Test Store).
appId: app.nuni.mood
---
- runFlow: common/launch-dev.yaml
- tapOn:
    id: dev.purchases
- assertVisible: 'mood_premium: locked'
- tapOn:
    id: dev.purchases.paywall
- extendedWaitUntil:
    visible:
      id: a9.cta
    timeout: 30000
# Cancel: stays on the paywall, no error toast.
- tapOn:
    id: a9.cta
- tapOn: Cancel
- assertVisible:
    id: a9.cta
- assertNotVisible: "Purchase didn't go through. Please try again."
# Failure: error toast, still on the paywall.
- tapOn:
    id: a9.cta
- tapOn: Test failed purchase
- assertVisible: "Purchase didn't go through. Please try again."
- assertVisible:
    id: a9.cta
# Success: toast, paywall closes, entitlement unlocked.
- tapOn:
    id: a9.cta
- tapOn: Test valid purchase
- assertVisible: "You're all set!"
- assertVisible:
    id: dev.purchases.premium
- takeScreenshot: after-purchase
- assertVisible: 'mood_premium: active'
- tapOn:
    id: dev.purchases.restore
- assertVisible: 'restore: restored'
