# Release-configuration smoke test (no Metro, embedded bundle): the app launches, onboarding shows,
# Skip reaches the home screen. Run with scripts/release-smoke.sh.
appId: app.nuni.mood
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: a2.skip
    timeout: 30000
- tapOn:
    id: a2.skip
# First run opens the A4 entry sheet over A3; close it to reach the home screen.
- extendedWaitUntil:
    visible:
      id: a4.save
    timeout: 15000
- tapOn:
    id: a4.close
- extendedWaitUntil:
    visible:
      id: a3.title
    timeout: 15000
- takeScreenshot: release-home
