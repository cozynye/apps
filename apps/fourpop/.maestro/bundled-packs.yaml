# Generated bundled packs (Pop, Y2K — 2026-10-15): B4 lists them under Basics, the B7 sticker tray
# shows their stickers after the base ones, and a Studio frame renders in B8 with Pop + Y2K stickers
# and the booth-style date + time stamp.
# Needs Metro started with EXPO_PUBLIC_MOCK_CAMERA=1 (simulators have no camera).
appId: app.fourpop.booth
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible:
      id: b2.skip
    timeout: 20000
- tapOn:
    id: b2.skip
- extendedWaitUntil:
    visible:
      id: b3.title
    timeout: 10000
- tapOn:
    id: b3.allFrames
- extendedWaitUntil:
    visible:
      id: b4.frame.base-classic
    timeout: 10000
- scrollUntilVisible:
    element:
      id: b4.frame.pop-sunset
    direction: DOWN
- takeScreenshot: packs-b4-pop
- scrollUntilVisible:
    element:
      id: b4.frame.y2k-chrome
    direction: DOWN
- takeScreenshot: packs-b4-y2k
- scrollUntilVisible:
    element:
      id: b4.frame.studio-black
    direction: DOWN
- takeScreenshot: packs-b4-studio
# Studio Black: a dark mat, so B8 also exercises the edge-colour corner fill.
- tapOn:
    id: b4.frame.studio-black
- extendedWaitUntil:
    visible:
      id: b3.startShooting
    timeout: 10000
- tapOn:
    id: b3.startShooting
- extendedWaitUntil:
    visible:
      id: b5.shutter
    timeout: 10000
- tapOn:
    id: b5.timer.3
- tapOn:
    id: b5.shutter
- extendedWaitUntil:
    visible:
      id: b6.title
    timeout: 60000
- tapOn:
    id: b6.shot.0
- tapOn:
    id: b6.shot.2
- tapOn:
    id: b6.shot.4
- tapOn:
    id: b6.shot.6
- tapOn:
    id: b6.next
- extendedWaitUntil:
    visible:
      id: b7.preview
    timeout: 10000
- tapOn:
    id: b7.tool.stickers
# Horizontal tray at ~84% of the screen height: swipe it until the Pop sticker is on screen.
- repeat:
    times: 10
    while:
      notVisible:
        id: b7.sticker.pop-strawberry
    commands:
      - swipe:
          start: 80%, 84%
          end: 20%, 84%
          duration: 1000
- tapOn:
    id: b7.sticker.pop-strawberry
- assertVisible:
    id: b7.deleteItem
# Horizontal tray at ~84% of the screen height: swipe it until the Pop sticker is on screen.
- repeat:
    times: 10
    while:
      notVisible:
        id: b7.sticker.pop-wow
    commands:
      - swipe:
          start: 80%, 84%
          end: 20%, 84%
          duration: 1000
- tapOn:
    id: b7.sticker.pop-wow
- repeat:
    times: 10
    while:
      notVisible:
        id: b7.sticker.y2k-y2k
    commands:
      - swipe:
          start: 80%, 84%
          end: 20%, 84%
          duration: 1000
- tapOn:
    id: b7.sticker.y2k-y2k
# Booth-style date + time stamp (format 3).
- tapOn:
    id: b7.tool.date
# The fourth chip sits past the right edge of the date row.
- swipe:
    start: 80%, 84%
    end: 20%, 84%
    duration: 1000
- tapOn:
    id: b7.date.3
- takeScreenshot: packs-b7
- tapOn:
    id: b7.done
- extendedWaitUntil:
    visible:
      id: b8.inGallery
    timeout: 20000
- takeScreenshot: packs-b8
