# Needs Metro started with EXPO_PUBLIC_MONETIZATION=on (1.0 ships free; purchases are opt-in).
# B11 subscription via B12 (RevenueCat Test Store): cancel → failed → valid purchase unlocks Premium,
# then Restore in B12 reports restored. Needs EXPO_PUBLIC_RC_IOS_KEY_FOURPOP (test_ key).
appId: app.fourpop.booth
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible:
      id: b2.skip
    timeout: 20000
- tapOn:
    id: b2.skip
- extendedWaitUntil:
    visible:
      id: b3.settings
    timeout: 10000
- tapOn:
    id: b3.settings
- extendedWaitUntil:
    visible:
      id: b12.premium
    timeout: 10000
# Restore with nothing bought: a notice, not an error (PLAN 예외 › 구매 복원했는데 권한 없음).
- tapOn:
    id: b12.restore
- assertVisible: 'No purchases found.*|Không tìm thấy giao dịch.*|ไม่พบการซื้อ.*'
- tapOn:
    id: b12.premium
- extendedWaitUntil:
    visible:
      id: b11.cta
    timeout: 30000
- takeScreenshot: paywall-b11-plans
# Cancel: stays on the paywall, no error toast.
- tapOn:
    id: b11.cta
- tapOn: Cancel
- assertVisible:
    id: b11.cta
- assertNotVisible: "Purchase didn't go through.*|Giao dịch chưa thành công.*|การซื้อไม่สำเร็จ.*"
# Failure: error toast, still on the paywall.
- tapOn:
    id: b11.cta
- tapOn: Test failed purchase
- assertVisible: "Purchase didn't go through.*|Giao dịch chưa thành công.*|การซื้อไม่สำเร็จ.*"
- assertVisible:
    id: b11.cta
# Success: toast, paywall closes, Premium row gone from settings.
- tapOn:
    id: b11.cta
- tapOn: Test valid purchase
- assertVisible: "You're all set!|Xong rồi!|เรียบร้อยแล้ว!"
- extendedWaitUntil:
    notVisible:
      id: b12.premium
    timeout: 10000
- assertVisible:
    id: b12.restore
- takeScreenshot: settings-premium
- tapOn:
    id: b12.restore
- assertVisible: 'Purchases restored|Đã khôi phục giao dịch|กู้คืนการซื้อแล้ว'
