<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1f1f24;}
button{font-family:inherit;cursor:pointer;}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:6px 0;font-size:11px;font-weight:500;color:#66656e;}
.tool.on{color:#c94c43;}
.filt{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-size:11px;color:#66656e;}
.filt .sw{width:56px;height:56px;border-radius:8px;border:2px solid transparent;}
.filt.on .sw{border-color:#ff8a80;}
.filt.on{color:#c94c43;font-weight:600;}
.slot{background:#3d3d44;border-radius:4px;}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f6f3; position: relative; overflow: hidden; display: flex; flex-direction: column;">
  <!-- top bar -->
  <div style="padding: 54px 16px 0 16px; display: flex; align-items: center; justify-content: space-between;">
    <a href="B5Capture.dc.html" aria-label="Back to pick shots" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1f1f24;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="font-size: 18px; font-weight: 600;">Decorate</div>
    <div style="display:flex;align-items:center;gap:4px;"><button aria-label="Undo" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1f1f24;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>

  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 8px 16px;">

      <div class="slot" style="flex-grow:1;"></div><div class="slot" style="flex-grow:1;"></div><div class="slot" style="flex-grow:1;"></div><div class="slot" style="flex-grow:1;"></div>

        <span aria-label="Delete" style="position:absolute; width:22px; height:22px; border-radius:999px; background:#1f1f24; left:-11px; top:-11px; display:flex; align-items:center; justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>

        <span aria-label="Resize" style="position:absolute; width:22px; height:22px; border-radius:999px; background:#ff8a80; right:-11px; bottom:-11px;"></span>
      </div>
      <div style="position:absolute; left:14px; bottom:12px; font-size:10px; color:#66656e;">20/10/2026</div>
    </div>
  </div>

    <button class="filt"><span class="sw" style="background:#7a7a80;"></span>Mono</button>
    <button class="filt"><span class="sw" style="background:#b89a7a;"></span>Warm</button>
    <button class="filt"><span class="sw" style="background:#8e9bb0;position:relative;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" style="position:absolute;top:4px;right:4px;"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>Film</button>
    <button class="filt"><span class="sw" style="background:#d8c3b0;position:relative;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" style="position:absolute;top:4px;right:4px;"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>Fade</button>
    <button class="filt"><span class="sw" style="background:#5d5c64;position:relative;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" style="position:absolute;top:4px;right:4px;"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>Night</button>
  </div>

  <!-- tool bar -->
  <div style="background: #ffffff; border-top: 1px solid #e3e1db; padding: 8px 8px 30px 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
    <button class="tool on" aria-pressed="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg>Filter</button>
    <button class="tool"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>Stickers</button>
    <button class="tool"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Draw</button>
    <button class="tool"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M12 5v14"/></svg>Text</button>
    <button class="tool"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Date</button>
  </div>
</div>
