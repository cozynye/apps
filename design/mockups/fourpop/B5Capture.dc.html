<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fourpop capture countdown</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#f2f1ee;}
button{font-family:inherit;cursor:pointer;}
.pill{height:36px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,0.14);color:#f2f1ee;font-size:13px;font-weight:600;}
.pill.on{background:#ff8a80;color:#1f1f24;}
.thumb{width:44px;height:30px;border-radius:6px;background:#3a3a40;border:1px solid #4a4a52;}
.thumb.done{background:#8a6a66;border-color:#ff9a91;}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141416; position: relative; overflow: hidden; display: flex; flex-direction: column;">
  <!-- top bar -->
  <div style="padding: 54px 16px 0 16px; display: flex; align-items: center; justify-content: space-between;">
    <a href="B3Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #f2f1ee;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="font-size: 13px; font-weight: 600; color: #a8a7af;">Shot 3 of 8</div>
    <button aria-label="Flip camera" disabled style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #f2f1ee; opacity: 0.35;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3M21 12a9 9 0 0 1-15.5 6.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
  </div>

  <!-- viewfinder (3:2 slot, frame overlay) -->
  <div style="margin: 16px 16px 0 16px; position: relative; aspect-ratio: 3 / 2; border-radius: 14px; background: #26262a; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #3d3d44 0%, #26262a 70%);"></div>
    <!-- frame overlay hint -->
    <div style="position: absolute; inset: 0; border: 10px solid rgba(255,255,255,0.9); border-radius: 14px; pointer-events: none;"></div>
    <!-- countdown -->
    <div style="position: relative; font-size: 144px; line-height: 144px; font-weight: 700; letter-spacing: -4px; color: #ff8a80; text-shadow: 0 2px 12px rgba(0,0,0,0.4);">2</div>
    <!-- pose guide -->
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center;"><div style="padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,0.5); font-size: 15px; font-weight: 600; color: #f2f1ee;">Pose: peace sign ✌</div></div>
  </div>

  <!-- shot strip -->
  <div style="padding: 20px 16px 0 16px; display: flex; gap: 6px; justify-content: center;">
    <div class="thumb done"></div><div class="thumb done"></div><div class="thumb" style="border-color:#ff8a80;"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
  </div>

  <!-- while shooting: timer & flash hidden -->
  <div style="padding: 24px 16px 0 16px; text-align: center; font-size: 13px; color: #a8a7af;">3s timer · Tap the button to pause</div>

  <!-- controls -->
  <div style="margin-top: auto; padding: 0 32px 48px 32px; display: flex; align-items: center; justify-content: space-between;">
    <span style="width:52px;height:52px;"></span>
    <a href="B7Decorate.dc.html" aria-label="Pause" style="width: 84px; height: 84px; border-radius: 999px; background: #ff8a80; box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="#1f1f24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></a>
    <span style="width:52px;height:52px;"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
